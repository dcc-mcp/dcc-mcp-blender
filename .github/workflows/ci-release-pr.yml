# CI gate for Release Please PRs
#
# Problem:
# A release PR must not carry anything outside the release allowlist — no
# stray source change should reach `main` by riding along with a version bump.
# Validating that needs a workflow that is guaranteed to run on a release PR.
#
# Note on triggers (verified 2026-10-12): `release.yml` drives release-please
# with `secrets.PERSONAL_ACCESS_TOKEN`, not `GITHUB_TOKEN`, so release PRs are
# NOT subject to the "bot PRs do not trigger workflows" restriction — `ci.yml`
# runs on them for real. An earlier version of this header claimed this file
# existed to compensate for that restriction; that rationale is obsolete.
#
# Solution:
# Use `pull_request_target` so the gate runs regardless of how the release PR
# was created or who authored it. This workflow validates the release PR
# metadata and the set of changed files, failing the check when a release PR
# carries anything outside the release allowlist. It does not create commit
# statuses; the lint contexts on a release PR come from real `ci.yml` runs
# (see below).
#
# This workflow's allowlist gate is not redundant with `ci.yml`: `ci.yml` runs
# tests and lint, but never checks *which files* a release PR is allowed to
# touch. Keeping both means the allowlist gate survives even if
# `release.yml` ever falls back to `GITHUB_TOKEN`.
#
# NO LINT STATUS PRESEEDING — this workflow reports nothing for `Lint` or
# `Lint SKILL.md files`.
# It used to post pre-computed `success` commit statuses for both jobs. That
# was redundant and, once the lint jobs became gating, actively unsafe:
# `ci.yml` already runs both jobs for real on `release-please--branches--**`
# pushes, and it sets `concurrency.cancel-in-progress: true`. When a release
# branch is pushed twice in quick succession the real run is cancelled, and a
# cancelled run reports no status — so the newest state left on that context
# could be the preseeded `success`. With the lint jobs required, a cancelled
# run would then look like a green gate.
# Deleting the preseeding steps removes that failure mode: the contexts are
# now reported only by real runs. It also means a release PR inherits the
# same lint gate as every other PR.
#
# The remaining job still gates release PRs on metadata and changed files:
#   - The head branch name starts with `release-please--` (job-level `if`),
#     AND
#   - The PR author is `github-actions[bot]` or `release-please[bot]`
#     (the `noop` output of "Validate release PR", which gates every
#     downstream step).
# A human-authored release branch sets `noop=true` and validates nothing;
# regular CI handles it. Both conditions must hold for the gate to run — do
# not rely on the branch-name filter alone.
#   - "Validate release PR files" hard-fails when the PR touches anything
#     outside the release allowlist (`.release-please-manifest.json`,
#     `CHANGELOG.md`, `pyproject.toml`, `Cargo.toml`, `Cargo.lock`, version
#     modules and `blender_manifest.toml`). Adding a file to that allowlist
#     WIDENS the set of changes this workflow will vouch for; any such change
#     must justify that the new file is release metadata only.
#
# Security:
# - `pull_request_target` runs in the context of the base branch (main)
# - We do NOT checkout or execute any code from the PR branch
# - We only validate PR metadata (branch name, author) and changed file names
# - This is safe per GitHub's security guidelines for `pull_request_target`

name: CI (Release PR)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  release-pr-gate:
    name: Release PR Gate
    runs-on: ubuntu-latest
    # Only run for release-please PRs
    if: startsWith(github.head_ref, 'release-please--')
    steps:
      - name: Validate release PR
        id: release-meta
        env:
          RELEASE_HEAD_REF: ${{ github.head_ref }}
          RELEASE_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "## Release PR CI Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${RELEASE_HEAD_REF}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${RELEASE_AUTHOR}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Only gate release-please bot PRs. PAT-created PRs trigger normal CI.
          AUTHOR="${RELEASE_AUTHOR}"
          if [[ "$AUTHOR" != "github-actions[bot]" && "$AUTHOR" != "release-please[bot]" ]]; then
            echo "✅ PR created by user (PAT), regular CI will handle this." >> $GITHUB_STEP_SUMMARY
            echo "noop=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "✅ Release PR from bot — gating through commit status." >> $GITHUB_STEP_SUMMARY
          echo "noop=false" >> $GITHUB_OUTPUT

      - name: Validate release PR files
        if: steps.release-meta.outputs.noop == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const pull = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100
            });

            const names = files.map((file) => file.filename).sort();

            // Release PRs typically only modify version/changelog files.
            // Allow common patterns but flag unexpected files.
            const releaseFiles = [
              '.release-please-manifest.json',
              'CHANGELOG.md',
              'pyproject.toml',
              'Cargo.toml',
              'Cargo.lock',
              'version.py',
              '__version__.py',
              '__init__.py',
              'blender_manifest.toml',
            ];
            const disallowed = names.filter(
              (name) => !releaseFiles.some((rf) => name.endsWith(rf) || name === rf)
            );
            if (disallowed.length > 0) {
              core.setFailed(
                `Release PR touches unexpected files: ${disallowed.join(', ')}. ` +
                'If these are valid, update the allowed list in ci-release-pr.yml.'
              );
              return;
            }

            await core.summary
              .addHeading('Release PR file validation', 2)
              .addList(names.map((name) => `\`${name}\``))
              .write();
