tools:
  - name: configure_photographic_post
    description: "Create or replace the owned Blender 5 compositor finish with warm halation, an S-curve, a 20% vignette, and frame-changing shadow-aware film grain."
    source_file: scripts/configure_photographic_post.py
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    input_schema:
      type: object
      additionalProperties: false
      properties:
        scene_name:
          type: string
          minLength: 1
        halation_threshold:
          type: number
          minimum: 0
          maximum: 10
          default: 0.7254901960784313
          description: "Highlights threshold. The prompt's 185 of 255 contract is 0.7254901960784313."
        halation_tint:
          type: array
          minItems: 3
          maxItems: 3
          items: {type: number, minimum: 0, maximum: 1}
          default: [1.0, 0.82, 0.62]
        halation_mix:
          type: number
          minimum: 0
          maximum: 1
          default: 0.34
        vignette_strength:
          type: number
          minimum: 0
          maximum: 1
          default: 0.2
        grain_strength:
          type: number
          minimum: 0
          maximum: 1
          default: 0.015
        grain_size:
          type: integer
          minimum: 32
          maximum: 2048
          default: 256
          description: "Square grain tile size in pixels."
        grain_seed:
          type: integer
          default: 1337
        grain_sequence_path:
          type: string
          minLength: 1
          description: "Optional local directory for a persistent PNG grain sequence. Use this when saved-scene background rendering must preserve per-frame grain across a worker process."
      required: []
    output_schema: &post_result
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context: {type: object}
    read_only: false
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    next-tools:
      on-success: [blender_photographic_post__validate_photographic_post]

  - name: validate_photographic_post
    description: "Read-only validation of the photographic compositor nodes, exact default contract values, grain image, and frame-change handler."
    source_file: scripts/validate_photographic_post.py
    execution: sync
    affinity: main
    timeout_hint_secs: 30
    input_schema:
      type: object
      additionalProperties: false
      properties:
        scene_name:
          type: string
          minLength: 1
        require_prompt_defaults:
          type: boolean
          default: true
          description: "Require the prompt's fixed 185/255 halation threshold, warm tint, 34% screen blend, 20% vignette, and standard gentle S-curve."
    output_schema: *post_result
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
