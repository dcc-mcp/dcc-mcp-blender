{
  "tools": [
    {
      "name": "create_mesh_from_data",
      "description": "Create bounded native geometry from explicit numeric data and verify its readback; reject existing names.",
      "source_file": "scripts/create_mesh_from_data.py",
      "input_schema": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "pattern": "^[A-Za-z][A-Za-z0-9_.-]{0,62}$"
          },
          "vertices": {
            "type": "array",
            "minItems": 3,
            "maxItems": 30000,
            "items": {
              "type": "array",
              "minItems": 3,
              "maxItems": 3,
              "items": {
                "type": "number",
                "minimum": -1000000,
                "maximum": 1000000
              }
            }
          },
          "faces": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50000,
            "items": {
              "type": "array",
              "minItems": 3,
              "maxItems": 128,
              "uniqueItems": true,
              "items": {
                "type": "integer",
                "minimum": 0,
                "maximum": 29999
              }
            }
          }
        },
        "required": [
          "name",
          "vertices",
          "faces"
        ],
        "additionalProperties": false
      },
      "output_schema": {
        "type": "object",
        "required": [
          "success"
        ],
        "properties": {
          "success": {
            "type": "boolean"
          }
        },
        "additionalProperties": true
      },
      "execution": "sync",
      "affinity": "main",
      "enforce_thread_affinity": true,
      "timeout_hint_secs": 60,
      "annotations": {
        "read_only_hint": false,
        "destructive_hint": false,
        "idempotent_hint": false,
        "open_world_hint": false
      },
      "read_only": false,
      "destructive": false,
      "idempotent": false
    },
