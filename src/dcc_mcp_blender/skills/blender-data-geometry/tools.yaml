            "default": 0
          },
          "bevel_resolution": {
            "type": "integer",
            "minimum": 0,
            "maximum": 4,
            "default": 0
          },
          "material_name": {
            "type": "string",
            "pattern": "^[A-Za-z][A-Za-z0-9_.-]{0,62}$"
          }
        },
        "required": [
          "name",
          "splines"
        ],
        "additionalProperties": false
      },
      "output_schema": {
        "type": "object",
