tools:
  - name: run_scene_checks
    description: "Run focused scene-level validation checks."
    source_file: scripts/run_scene_checks.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      properties:
        checks:
          type: array
          items:
            type: string
        object_names:
          type: array
          items:
            type: string
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: validate_mesh
    description: "Validate one mesh object against geometry and optional pipeline rules."
    source_file: scripts/validate_mesh.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name]
      properties:
        object_name:
          type: string
          minLength: 1
        rules:
          type: object
          additionalProperties: true
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: validate_materials
    description: "Validate material slots, required node trees, and linked image file presence without loading images. Check report.context.resource_checks_complete for incomplete sequence, packed UDIM, or bounded graph inspection; this is not image decoding or render validation."
    source_file: scripts/validate_materials.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      properties:
        object_names:
          type: array
          items:
            type: string
        rules:
          type: object
          additionalProperties: true
          properties:
            require_materials:
              type: boolean
              default: true
              description: "Report mesh objects without material assignments."
            require_nodes:
              type: boolean
              default: false
              description: "Reject disabled or empty material node trees. Linked image resources are checked independently; unlinked and muted nodes are ignored."
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: validate_animation
    description: "Validate animation frame ranges and optional keyframe requirements."
    source_file: scripts/validate_animation.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      properties:
        object_names:
          type: array
          items:
            type: string
        frame_range:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
        rules:
          type: object
          additionalProperties: true
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: validate_export_readiness
    description: "Validate selected objects for a target export format."
    source_file: scripts/validate_export_readiness.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_names, target_format]
      properties:
        object_names:
          type: array
          minItems: 1
          items:
            type: string
        target_format:
          type: string
          minLength: 1
        preset_name:
          type: string
        rules:
          type: object
          additionalProperties: true
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: validate_photographic_shot
    description: "Validate the complete real-toy shot contract including metric scale, camera limits, continuous eased motion, endpoint extensions, hero bevel, textured surfaces, render profile, compositor finish, and animated hide_render violations."
    source_file: scripts/validate_photographic_shot.py
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    input_schema:
      type: object
      additionalProperties: false
      properties:
        scene_name:
          type: string
          minLength: 1
        camera_name:
          type: string
          minLength: 1
        hero_object:
          type: string
          minLength: 1
        background_object:
          type: string
          minLength: 1
        floor_object:
          type: string
          minLength: 1
        wall_object:
          type: string
          minLength: 1
        source_name:
          type: string
          minLength: 1
        source_type:
          type: string
          enum: [SUN_WINDOW, LAMP, SCREEN, OUTDOOR_HDRI]
          default: LAMP
        shot_type:
          type: string
          enum: [CHARACTER, WIDE]
          default: CHARACTER
        floor_z:
          type: number
          default: 0.0
        frame_range:
          type: array
          minItems: 2
          maxItems: 2
          items: {type: integer}
        profile_name:
          type: string
          enum: [PREVIEW, FINAL]
          default: FINAL
        require_post:
          type: boolean
          default: true
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: get_validation_report
    description: "Return a stored validation report by id, or the latest report."
    source_file: scripts/get_validation_report.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      properties:
        report_id:
          type: string
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
