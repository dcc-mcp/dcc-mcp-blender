tools:
  - name: export_model_state
    description: >-
      Export normalized `dcc-mcp/model-state@1` evidence for the whole scene or
      a named modeling scope. The read-only payload includes parts, hierarchy,
      mesh topology and UV/material facts, bounds, transforms, and explicit
      partial/unavailable markers when Blender cannot report a check.
    source_file: scripts/export_model_state.py
    execution: sync
    affinity: main
    timeout_hint_secs: 10
    input_schema:
      type: object
      additionalProperties: false
      properties:
        object_names:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: "Optional bounded modeling scope. Defaults to all scene objects."
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: run_scene_checks
    description: "Run focused scene-level validation checks."
    source_file: scripts/run_scene_checks.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      properties:
        checks:
          type: array
          items:
            type: string
        object_names:
          type: array
          items:
            type: string
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: validate_mesh
    description: "Validate one mesh object against geometry and optional pipeline rules."
    source_file: scripts/validate_mesh.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name]
      properties:
        object_name:
          type: string
          minLength: 1
        rules:
          type: object
          additionalProperties: true
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: validate_materials
    description: "Validate material slots, required node trees, and linked image file presence without loading images. Check report.context.resource_checks_complete for incomplete sequence, packed UDIM, or bounded graph inspection; this is not image decoding or render validation."
    source_file: scripts/validate_materials.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      properties:
        object_names:
          type: array
          items:
            type: string
        rules:
          type: object
          additionalProperties: true
          properties:
            require_materials:
              type: boolean
              default: true
              description: "Report mesh objects without material assignments."
            require_nodes:
              type: boolean
              default: false
              description: "Reject disabled or empty material node trees. Linked image resources are checked independently; unlinked and muted nodes are ignored."
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: validate_animation
    description: "Validate animation frame ranges and optional keyframe requirements."
    source_file: scripts/validate_animation.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      properties:
        object_names:
          type: array
          items:
            type: string
        frame_range:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
        rules:
          type: object
          additionalProperties: true
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: validate_export_readiness
    description: "Validate selected objects for a target export format."
    source_file: scripts/validate_export_readiness.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_names, target_format]
      properties:
        object_names:
          type: array
          minItems: 1
          items:
            type: string
        target_format:
          type: string
          minLength: 1
        preset_name:
          type: string
        rules:
          type: object
          additionalProperties: true
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: validate_photographic_shot
    description: "Validate the complete real-toy shot contract including metric scale, Poly Haven PBR maps with object-space box projection on hero, toy, background, floor, and wall surfaces, life-size environment dimensions, perspective camera limits, continuous eased motion, endpoint extensions, bevels on every supplied toy part, OptiX or Metal rendering, compositor finish, preview evidence and color-safety analysis, hero-background contrast, and animated hide_render violations."
    source_file: scripts/validate_photographic_shot.py
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    input_schema:
      type: object
      additionalProperties: false
      required: [hero_object, focus_object, background_object, floor_object, wall_object, source_name]
      properties:
        scene_name:
          type: string
          minLength: 1
        camera_name:
          type: string
          minLength: 1
        hero_object:
          type: string
          minLength: 1
        focus_object:
          type: string
          minLength: 1
          description: "Object placed at the character's eyes and used by camera depth of field."
        background_object:
          type: string
          minLength: 1
        floor_object:
          type: string
          minLength: 1
        wall_object:
          type: string
          minLength: 1
        source_name:
          type: string
          minLength: 1
        source_type:
          type: string
          enum: [SUN_WINDOW, LAMP, SCREEN, OUTDOOR_HDRI]
          default: LAMP
        shot_type:
          type: string
          enum: [CHARACTER, WIDE]
          default: CHARACTER
        floor_z:
          type: number
          default: 0.0
        frame_range:
          type: array
          minItems: 2
          maxItems: 2
          items: {type: integer}
        profile_name:
          type: string
          enum: [PREVIEW, FINAL]
          default: FINAL
        device_backend:
          type: string
          enum: [AUTO, OPTIX, CUDA, HIP, ONEAPI, METAL, CPU]
          default: AUTO
          description: "Cycles backend to validate. The complete photographic shot contract accepts OptiX or Metal and rejects CPU fallback."
        scene_kind:
          type: string
          enum: [EXTERIOR, INTERIOR]
          default: EXTERIOR
          description: "Use INTERIOR to validate the 112 to 176 sample contract."
        toy_object_names:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: "Optional complete list of mesh toy parts whose render-visible bevels must be validated. Defaults to hero_object."
        minimum_environment_dimension_m:
          type: number
          exclusiveMinimum: 0
          default: 1.0
          description: "Minimum life-size dimension required on each supplied floor and wall object."
        preview_still_path:
          type: string
          minLength: 1
          description: "Local 25% / 32-sample preview still required for FINAL validation and rendered-pixel warm highlight analysis."
        require_post:
          type: boolean
          default: true
        require_preview_still:
          type: boolean
          default: true
          description: "Require preview_still_path when profile_name is FINAL."
        require_pbr_textures:
          type: boolean
          default: true
          description: "Require the hero, supplied toy parts, background, floor, and wall to use Poly Haven diffuse, roughness, and GL normal maps with object-space box projection and blend 0.25."
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: get_validation_report
    description: "Return a stored validation report by id, or the latest report."
    source_file: scripts/get_validation_report.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      properties:
        report_id:
          type: string
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: validate_asset_build_manifest
    description: "Validate scene parts, controls, actions, references, and outputs against an asset build manifest."
    source_file: scripts/validate_asset_build_manifest.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      properties:
        manifest_path:
          type: string
          minLength: 1
        manifest:
          type: object
          additionalProperties: true
        compare_snapshot:
          type: boolean
          default: false
        strict_snapshot:
          type: boolean
          default: false
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true

  - name: compare_asset_snapshot
    description: "Compare the current scene with a saved snapshot and report deterministic differences."
    source_file: scripts/compare_asset_snapshot.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [baseline_path]
      properties:
        baseline_path:
          type: string
          minLength: 1
        object_names:
          type: array
          items:
            type: string
        strict:
          type: boolean
          default: false
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true
