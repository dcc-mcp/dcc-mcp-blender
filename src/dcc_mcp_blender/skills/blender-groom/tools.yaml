tools:
  - name: create_groom_guides
    description: "Create deterministic surface-attached hair guide curves on a mesh object."
    source_file: scripts/create_groom_guides.py
    execution: sync
    affinity: main
    timeout_hint_secs: 30
    input_schema:
      type: object
      additionalProperties: false
      required: [scalp_object_name]
      properties:
        scalp_object_name: {type: string, minLength: 1}
        groom_name: {type: string, minLength: 1, default: "Hair Groom"}
        guide_count: {type: integer, minimum: 1, maximum: 20000, default: 800}
        segments: {type: integer, minimum: 2, maximum: 32, default: 8}
        length: {type: number, exclusiveMinimum: 0, maximum: 100, default: 0.15}
        width: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.003}
        normal_weight: {type: number, minimum: 0, maximum: 1, default: 0.85}
        direction_bias:
          type: array
          minItems: 3
          maxItems: 3
          items: {type: number}
          default: [0, 0, 1]
        curl: {type: number, minimum: 0, maximum: 1, default: 0.15}
        seed: {type: integer, default: 0}
        collection_name: {type: string, minLength: 1}
        material_name: {type: string, minLength: 1, default: "DCC MCP Groom Hair"}
        hair_color:
          type: array
          minItems: 3
          maxItems: 4
          items: {type: number, minimum: 0, maximum: 1}
          default: [0.035, 0.012, 0.006, 1]
        roughness: {type: number, minimum: 0, maximum: 1, default: 0.55}
        root_height_min: {type: number, minimum: 0, maximum: 1, default: 0.2}
        root_height_max: {type: number, minimum: 0, maximum: 1, default: 1.0}
        replace_existing: {type: boolean, default: false}
    output_schema: &groom_result
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context: {type: object}
    read_only: false
    destructive: true
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false

  - name: inspect_grooms
    description: "Inspect one generated groom or list all generated grooms with guide and material readback."
    source_file: scripts/inspect_grooms.py
    execution: sync
    affinity: main
    input_schema:
      type: object
      additionalProperties: false
      properties:
        object_name: {type: string, minLength: 1}
    output_schema: *groom_result
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: set_groom_style
    description: "Update groom width, root-preserving length, hair color, roughness, or material."
    source_file: scripts/set_groom_style.py
    execution: sync
    affinity: main
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name]
      properties:
        object_name: {type: string, minLength: 1}
        width: {type: number, exclusiveMinimum: 0, maximum: 1}
        length_scale: {type: number, exclusiveMinimum: 0, maximum: 10}
        hair_color:
          type: array
          minItems: 3
          maxItems: 4
          items: {type: number, minimum: 0, maximum: 1}
        roughness: {type: number, minimum: 0, maximum: 1}
        material_name: {type: string, minLength: 1}
    output_schema: *groom_result
    read_only: false
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
