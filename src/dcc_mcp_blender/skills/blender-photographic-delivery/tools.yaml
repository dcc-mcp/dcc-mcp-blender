tools:
  - name: configure_photographic_video_output
    description: "Configure Blender native FFmpeg output for 24 fps MPEG-4 H.264 with custom CRF 15 and record the exact yuv420p/BT.709 delivery contract."
    source_file: scripts/configure_photographic_video_output.py
    execution: sync
    affinity: main
    timeout_hint_secs: 30
    input_schema:
      type: object
      additionalProperties: false
      required: [filepath]
      properties:
        filepath:
          type: string
          minLength: 1
        scene_name:
          type: string
          minLength: 1
        overwrite:
          type: boolean
          default: true
    output_schema: &delivery_result
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context: {type: object}
    read_only: false
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true
    next-tools:
      on-success: [blender_photographic_delivery__validate_photographic_video_output]

  - name: validate_photographic_video_output
    description: "Read-only validation of native Blender FFmpeg settings and the exact external encoder contract."
    source_file: scripts/validate_photographic_video_output.py
    execution: sync
    affinity: main
    timeout_hint_secs: 30
    input_schema:
      type: object
      additionalProperties: false
      properties:
        scene_name:
          type: string
          minLength: 1
    output_schema: *delivery_result
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: encode_photographic_video
    description: "Encode a rendered frame sequence as H.264 CRF 15, yuv420p, BT.709, 24 fps using FFmpeg."
    source_file: scripts/encode_photographic_video.py
    execution: sync
    affinity: any
    timeout_hint_secs: 3600
    input_schema:
      type: object
      additionalProperties: false
      required: [input_pattern, output_path, start_frame, end_frame]
      properties:
        input_pattern:
          type: string
          minLength: 1
          description: "Frame path pattern with # placeholders such as C:/renders/toy_####.jpg or a printf pattern."
        output_path:
          type: string
          minLength: 1
        start_frame:
          type: integer
          minimum: 0
        end_frame:
          type: integer
          minimum: 0
        ffmpeg_path:
          type: string
          default: ffmpeg
        overwrite:
          type: boolean
          default: false
        timeout_seconds:
          type: integer
          minimum: 1
          default: 3600
    output_schema: *delivery_result
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: true
