tools:
  - name: list_uv_maps
    description: "List UV maps on a mesh object, including active map and coordinate counts."
    source_file: scripts/list_uv_maps.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name]
      properties:
        object_name:
          type: string
          minLength: 1
          description: Mesh object name.
    output_schema: &uv_result_schema
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: create_uv_map
    description: "Create a UV map on a mesh object and optionally make it active."
    source_file: scripts/create_uv_map.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name, name]
      properties:
        object_name:
          type: string
          minLength: 1
          description: Mesh object name.
        name:
          type: string
          minLength: 1
          description: New UV map name.
        set_active:
          type: boolean
          default: true
          description: Make the created UV map active.
    output_schema: *uv_result_schema
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false

  - name: delete_uv_map
    description: "Delete a named UV map from a mesh object."
    source_file: scripts/delete_uv_map.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name, name]
      properties:
        object_name:
          type: string
          minLength: 1
          description: Mesh object name.
        name:
          type: string
          minLength: 1
          description: UV map to delete.
    output_schema: *uv_result_schema
    read_only: false
    destructive: true
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false

  - name: copy_uv_map
    description: "Copy UV coordinates from one UV map into a newly-created target map."
    source_file: scripts/copy_uv_map.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name, source, target]
      properties:
        object_name:
          type: string
          minLength: 1
          description: Mesh object name.
        source:
          type: string
          minLength: 1
          description: Existing UV map name to copy from.
        target:
          type: string
          minLength: 1
          description: New UV map name to create.
    output_schema: *uv_result_schema
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false

  - name: get_uv_info
    description: "Return UV map, coordinate, loop, polygon, and island statistics for a mesh object."
    source_file: scripts/get_uv_info.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name]
      properties:
        object_name:
          type: string
          minLength: 1
          description: Mesh object name.
    output_schema: *uv_result_schema
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: get_uv_islands
    description: "Summarize UV islands and their face membership and 2D bounds."
    source_file: scripts/get_uv_islands.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name]
      properties:
        object_name:
          type: string
          minLength: 1
          description: Mesh object name.
        uv_map:
          type: string
          minLength: 1
          description: Optional UV map name. Defaults to the active UV map.
    output_schema: *uv_result_schema
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: project_uvs
    description: "Generate UV coordinates using planar, cube, bounds, smart, sphere, cylinder, or view projection."
    source_file: scripts/project_uvs.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name]
      properties:
        object_name:
          type: string
          minLength: 1
          description: Mesh object name.
        method:
          type: string
          enum: [planar, cube, bounds, smart, sphere, cylinder, view]
          default: planar
          description: Projection method.
        axis:
          type: string
          enum: [x, y, z]
          default: z
          description: Projection axis for planar and bounds projection.
        margin:
          type: number
          minimum: 0
          exclusiveMaximum: 0.5
          default: 0
          description: Margin reserved inside 0-1 UV space.
    output_schema: *uv_result_schema
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false

  - name: unwrap_uvs
    description: "Unwrap selected mesh faces through Blender's smart, angle-based, or conformal UV operators."
    source_file: scripts/unwrap_uvs.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name]
      properties:
        object_name:
          type: string
          minLength: 1
          description: Mesh object name.
        method:
          type: string
          enum: [angle_based, conformal, smart]
          default: angle_based
          description: Blender unwrap method.
        margin:
          type: number
          minimum: 0
          exclusiveMaximum: 0.5
          default: 0.001
          description: Island margin.
    output_schema: *uv_result_schema
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false

  - name: pack_uvs
    description: "Pack UV islands through Blender's UV packing operator and optionally normalize the result."
    source_file: scripts/pack_uvs.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name]
      properties:
        object_name:
          type: string
          minLength: 1
          description: Mesh object name.
        margin:
          type: number
          minimum: 0
          exclusiveMaximum: 0.5
          default: 0.001
          description: Island margin.
        rotate:
          type: boolean
          default: true
          description: Allow island rotation while packing.
        normalize:
          type: boolean
          default: true
          description: Fit packed coordinates back into 0-1 space.
    output_schema: *uv_result_schema
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false

  - name: normalize_uvs
    description: "Normalize an active or named UV map into 0-1 UV space."
    source_file: scripts/normalize_uvs.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name]
      properties:
        object_name:
          type: string
          minLength: 1
          description: Mesh object name.
        uv_map:
          type: string
          minLength: 1
          description: Optional UV map name. Defaults to the active UV map.
    output_schema: *uv_result_schema
    read_only: false
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: audit_uv_layout
    timeout_hint_secs: 30
    description: "Read-only bounded UV quality audit of named source meshes: missing maps, invalid coordinates, degenerate triangles, tile bounds and positive-area overlaps. Budget exhaustion returns complete=false and passed=false."
    source_file: scripts/audit_uv_layout.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      required: [object_names]
      properties:
        object_names:
          type: array
          minItems: 1
          maxItems: 4096
          uniqueItems: true
          items: {type: string, minLength: 1}
          description: "Explicit source meshes in OBJECT mode; pass scene mesh names for a scene audit."
        uv_map:
          type: string
          minLength: 1
          description: "Named UV map; omit to inspect each object's active map without changing it."
        tile_policy:
          type: string
          enum: [unit, udim, unrestricted]
          default: unit
          description: "unit=[0,1]^2; udim=U in [0,10] and V>=0, allows tile crossings; unrestricted skips tile bounds."
        check_overlap: {type: boolean, default: true}
        overlap_scope:
          type: string
          enum: [per_object, selection]
          default: per_object
          description: "selection also checks overlap between objects sharing one UV space."
        allow_stacked:
          type: boolean
          default: false
          description: "Allow exactly coincident UV triangles, including opposite winding; partial overlaps still fail."
        max_triangles: {type: integer, minimum: 1, maximum: 200000, default: 50000}
        max_pair_tests: {type: integer, minimum: 1, maximum: 2000000, default: 200000}
        max_report_items: {type: integer, minimum: 0, maximum: 1000, default: 100}
        area_epsilon:
          type: number
          exclusiveMinimum: 0
          maximum: 0.0001
          default: 0.0000000001
          description: "Area tolerance in UV square units. Coordinates beyond magnitude 1e12 are invalid."
    output_schema: *uv_result_schema
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: export_uv_layout
    timeout_hint_secs: 30
    description: "Export actual source polygon UV edges to SVG: up to 64 labelled object panels, or a shared atlas overlay of up to 4096 meshes. Does not change UVs, selection or mode. Refuses overwrite, missing maps, invalid coordinates and budget exhaustion."
    source_file: scripts/export_uv_layout.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      required: [object_names, output_path]
      properties:
        object_names:
          type: array
          minItems: 1
          maxItems: 4096
          uniqueItems: true
          items: {type: string, minLength: 1}
        output_path:
          type: string
          minLength: 1
          description: "Absolute new .svg path; parent directory must exist. Existing output is never overwritten."
        uv_map: {type: string, minLength: 1}
        resolution: {type: integer, minimum: 256, maximum: 8192, default: 2048}
        max_triangles: {type: integer, minimum: 1, maximum: 500000, default: 50000}
        layout_mode:
          type: string
          enum: [panels, overlay]
          default: panels
          description: "panels separates objects (max 64); overlay preserves shared coordinates for a scene atlas (max 4096)."
    output_schema: *uv_result_schema
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: true
