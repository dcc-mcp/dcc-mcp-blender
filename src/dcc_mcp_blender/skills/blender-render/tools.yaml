tools:
  - name: render_scene
    description: "Render the current scene and save to a file"
    source_file: scripts/render_scene.py
    execution: sync
    affinity: main
    input_schema:
      type: object
      additionalProperties: false
      properties:
        output_path:
          type: string
          minLength: 1
          description: Optional destination image path; defaults to the scene output path.
        write_still:
          type: boolean
          default: true
          description: Write the rendered image to disk.
    read_only: false
    destructive: false
    idempotent: false
  - name: set_render_settings
    description: "Configure render settings (engine, resolution, samples, output path)"
    source_file: scripts/set_render_settings.py
    execution: sync
    affinity: main
    input_schema:
      type: object
      additionalProperties: false
      properties:
        engine:
          type: string
          enum: [CYCLES, BLENDER_EEVEE, BLENDER_EEVEE_NEXT, BLENDER_WORKBENCH]
          description: Blender render engine identifier.
        resolution_x:
          type: integer
          minimum: 1
          description: Horizontal output resolution in pixels.
        resolution_y:
          type: integer
          minimum: 1
          description: Vertical output resolution in pixels.
        resolution_percentage:
          type: integer
          minimum: 1
          maximum: 100
          description: Output resolution percentage.
        fps:
          type: integer
          minimum: 1
          description: Output frame rate.
        samples:
          type: integer
          minimum: 1
          description: Render sample count for Cycles or EEVEE.
        output_path:
          type: string
          minLength: 1
          description: Output file path or directory used by Blender.
        file_format:
          type: string
          minLength: 1
          description: Blender image format identifier such as PNG, JPEG, or OPEN_EXR.
    read_only: false
    destructive: false
    idempotent: true
  - name: get_render_info
    description: "Return current render settings"
    source_file: scripts/get_render_info.py
    execution: sync
    affinity: main
    input_schema:
      type: object
      additionalProperties: false
      properties: {}
    read_only: true
    destructive: false
    idempotent: true
  - name: capture_viewport
    description: "Capture the active viewport to an image file"
    source_file: scripts/capture_viewport.py
    execution: sync
    affinity: main
    input_schema:
      type: object
      additionalProperties: false
      required: [filepath]
      properties:
        filepath:
          type: string
          minLength: 1
          description: Destination image path.
        resolution_x:
          type: integer
          minimum: 1
          description: Optional temporary viewport capture width.
        resolution_y:
          type: integer
          minimum: 1
          description: Optional temporary viewport capture height.
    read_only: false
    destructive: false
    idempotent: false
  - name: start_render_job
    description: "Save the current .blend and start an isolated background animation render to multi-layer OpenEXR or PNG; optionally render only missing frames."
    source_file: scripts/start_render_job.py
    execution: sync
    affinity: main
    read_only: false
    destructive: false
    idempotent: false
    input_schema:
      type: object
      additionalProperties: false
      required: [output_pattern, start_frame, end_frame]
      properties:
        output_pattern:
          type: string
          minLength: 1
          description: "Absolute output pattern containing # placeholders, for example C:/renders/beauty_####. Blender appends the selected format's extension."
        output_format:
          type: string
          enum: [OPEN_EXR_MULTILAYER, PNG]
          default: OPEN_EXR_MULTILAYER
          description: "Background render output format. PNG produces display-ready frames; multilayer EXR preserves render passes."
        start_frame:
          type: integer
          minimum: 0
        end_frame:
          type: integer
          minimum: 0
        step:
          type: integer
          minimum: 1
          default: 1
        resume_missing:
          type: boolean
          default: true
          description: "Skip existing files with a valid signature for the selected output format and render only missing frames."
        device:
          type: string
          enum: [OPTIX, CUDA, HIP, ONEAPI, METAL, CPU]
          default: OPTIX
        save_before_render:
          type: boolean
          default: true
        factory_startup:
          type: boolean
          default: false
          description: "Disable user preferences and add-ons in the worker. Enable only after proving the scene has no external add-on dependency."
    next-tools:
      on-success: [blender_render__get_render_job]
      on-failure: [dcc_diagnostics__process_status]
  - name: get_render_job
    description: "Return bounded frame progress, process status, and log paths for an owned background render job."
    source_file: scripts/get_render_job.py
    execution: sync
    affinity: any
    read_only: true
    destructive: false
    idempotent: true
    input_schema:
      type: object
      additionalProperties: false
      required: [job_id]
      properties:
        job_id:
          type: string
          minLength: 1
  - name: cancel_render_job
    description: "Cancel the owned background Blender process tree for a render job; repeated cancellation is safe."
    source_file: scripts/cancel_render_job.py
    execution: sync
    affinity: any
    read_only: false
    destructive: true
    idempotent: true
    input_schema:
      type: object
      additionalProperties: false
      required: [job_id]
      properties:
        job_id:
          type: string
          minLength: 1
