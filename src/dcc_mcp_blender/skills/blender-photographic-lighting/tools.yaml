tools:
  - name: configure_motivated_lighting
    description: "Create one motivated window, lamp, screen, or outdoor HDRI-plus-sun source and apply the AgX color contract."
    source_file: scripts/configure_motivated_lighting.py
    execution: sync
    affinity: main
    input_schema:
      type: object
      additionalProperties: false
      required: [source_name]
      properties:
        source_name:
          type: string
          minLength: 1
        source_type:
          type: string
          enum: [SUN_WINDOW, LAMP, SCREEN, OUTDOOR_HDRI]
          default: LAMP
        energy:
          type: number
          exclusiveMinimum: 0
          default: 120.0
        color:
          type: array
          minItems: 3
          maxItems: 3
          items: {type: number, minimum: 0, maximum: 1}
        location:
          type: array
          minItems: 3
          maxItems: 3
          items: {type: number}
        rotation_degrees:
          type: array
          minItems: 3
          maxItems: 3
          items: {type: number}
        hdri_path:
          type: string
          minLength: 1
          description: "Local Poly Haven HDRI path required for OUTDOOR_HDRI."
        hdri_strength:
          type: number
          exclusiveMinimum: 0
          default: 0.35
        hdri_rotation_degrees:
          type: number
          default: 0.0
        hero_object:
          type: string
          minLength: 1
        background_object:
          type: string
          minLength: 1
        hdri_source:
          type: string
          minLength: 1
          description: "Optional provenance label for the supplied HDRI. Use Poly Haven for the photographic shot contract."
    output_schema: &result_schema
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context: {type: object}
    read_only: false
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true

  - name: validate_motivated_lighting
    description: "Read-only validation of the motivated source, outdoor HDRI and 1.2 degree sun, AgX settings, and hero-background contrast."
    source_file: scripts/validate_motivated_lighting.py
    execution: sync
    affinity: main
    input_schema:
      type: object
      additionalProperties: false
      required: [source_name]
      properties:
        source_name:
          type: string
          minLength: 1
        source_type:
          type: string
          enum: [SUN_WINDOW, LAMP, SCREEN, OUTDOOR_HDRI]
          default: LAMP
        hero_object:
          type: string
          minLength: 1
        background_object:
          type: string
          minLength: 1
        require_agx:
          type: boolean
          default: true
        preview_still_path:
          type: string
          minLength: 1
          description: "Optional local 25% preview still for machine color-safety analysis."
        require_polyhaven_hdri:
          type: boolean
          default: false
          description: "Require the outdoor HDRI to carry a Poly Haven provenance label."
    output_schema: *result_schema
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: analyze_photographic_test_still
    description: "Analyze a rendered preview still for 185/255 highlights, saturated warm bias, and a lower-key-energy recommendation without changing materials."
    source_file: scripts/analyze_photographic_test_still.py
    execution: sync
    affinity: main
    timeout_hint_secs: 60
    input_schema:
      type: object
      additionalProperties: false
      required: [image_path]
      properties:
        image_path:
          type: string
          minLength: 1
          description: "Local JPEG or PNG rendered by render_photographic_test_still."
        highlight_threshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.7254901961
        saturation_threshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.15
        warm_bias_threshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.08
        warning_ratio:
          type: number
          minimum: 0
          maximum: 1
          default: 0.1
        max_samples:
          type: integer
          minimum: 1
          default: 200000
        source_name:
          type: string
          minLength: 1
    output_schema:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
