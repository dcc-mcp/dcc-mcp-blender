tools:
  - name: inspect_armature
    description: Read bounded armature hierarchy, rest/pose matrices, constraints, and optional sampled skin weights.
    source_file: scripts/inspect_armature.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    input_schema:
      type: object
      additionalProperties: false
      required: [armature_name]
      properties:
        armature_name: {type: string, minLength: 1}
        bone_names:
          type: array
          minItems: 1
          maxItems: 1024
          uniqueItems: true
          items: {type: string, minLength: 1}
          description: Optional explicit subset, limited by max_bones.
        max_bones: {type: integer, minimum: 1, maximum: 1024, default: 256}
        include_constraints: {type: boolean, default: true}
        max_constraints_per_bone: {type: integer, minimum: 1, maximum: 128, default: 32}
        mesh_names:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: {type: string, minLength: 1}
          description: Explicit meshes with an Armature modifier targeting this rig.
        max_vertices_per_mesh:
          type: integer
          minimum: 1
          maximum: 100000
          default: 10000
          description: Deterministic vertex-index prefix, not full coverage unless scan_complete is true.
    output_schema:
      type: object
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context:
          type: object
          properties:
            schema: {type: string, enum: [blender.armature-inspection.v1]}
            armature_name: {type: string}
            frame: {type: integer}
            bone_count: {type: integer, minimum: 0}
            returned_bone_count: {type: integer, minimum: 0, maximum: 1024}
            truncated: {type: boolean}
            bones:
              type: array
              maxItems: 1024
              items:
                type: object
                required: [bone_name, parent, connected, use_deform, rest, pose]
                properties:
                  bone_name: {type: string}
                  parent: {type: [string, "null"]}
                  connected: {type: boolean}
                  use_deform: {type: boolean}
                  rest: {type: object}
                  pose: {type: object}
                  constraints: {type: object}
            mesh_weight_summaries:
              type: array
              maxItems: 16
              items:
                type: object
                required: [mesh_name, vertex_count, scanned_vertex_count, scan_complete, sampling]
                properties:
                  mesh_name: {type: string}
                  vertex_count: {type: integer, minimum: 0}
                  scanned_vertex_count: {type: integer, minimum: 0, maximum: 100000}
                  scan_complete: {type: boolean}
                  sampling: {type: string, enum: [vertex_index_prefix]}
    tags: [read-only, rigging, armature, weights]
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    next-tools:
      on-failure: [blender-scene__get_scene_info]
    call_examples:
      - arguments: {armature_name: CharacterRig, max_bones: 256, mesh_names: [Body], max_vertices_per_mesh: 10000}
        note: Inspect rig and explicitly sampled deform-group coverage.

  - name: set_pose_bone_transforms
    description: Validate every bone then set bulk rest-relative local pose channels, with actual evaluated readback and failure rollback.
    source_file: scripts/set_pose_bone_transforms.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    input_schema:
      type: object
      additionalProperties: false
      required: [armature_name, transforms]
      properties:
        armature_name: {type: string, minLength: 1}
        transforms:
          type: array
          minItems: 1
          maxItems: 1024
          description: Distinct bones; at least one channel each. Rotation forms are mutually exclusive.
          items:
            type: object
            additionalProperties: false
            required: [bone_name]
            properties:
              bone_name: {type: string, minLength: 1}
              location:
                type: array
                minItems: 3
                maxItems: 3
                items: {type: number, minimum: -1000000, maximum: 1000000}
                description: Absolute rest-relative local location in scene units.
              scale:
                type: array
                minItems: 3
                maxItems: 3
                items: {type: number, minimum: -1000000, maximum: 1000000}
                description: Each component must have absolute value at least 1e-6.
              rotation_euler:
                type: array
                minItems: 3
                maxItems: 3
                items: {type: number, minimum: -1000000, maximum: 1000000}
                description: Euler angles in radians, with explicit or default XYZ order.
              rotation_quaternion:
                type: array
                minItems: 4
                maxItems: 4
                items: {type: number, minimum: -1, maximum: 1}
                description: Unit quaternion in w,x,y,z order; selects QUATERNION mode.
              rotation_mode:
                type: string
                enum: [XYZ, XZY, YXZ, YZX, ZXY, ZYX, QUATERNION]
                description: Requires a matching explicit rotation channel.
    output_schema:
      type: object
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context:
          type: object
          properties:
            schema: {type: string, enum: [blender.pose-channel-update.v1]}
            armature_name: {type: string}
            frame: {type: integer}
            transform_space: {type: string, enum: [rest_relative_local_channels]}
            quaternion_order: {type: string, enum: [wxyz]}
            updated_bone_count: {type: integer, minimum: 1, maximum: 1024}
            transforms:
              type: array
              maxItems: 1024
              items:
                type: object
                required: [bone_name, requested, readback]
                properties:
                  bone_name: {type: string}
                  requested: {type: object}
                  readback: {type: object}
            rolled_back: {type: boolean}
            rollback_errors: {type: array, items: {type: string}}
    tags: [destructive, rigging, pose]
    read_only: false
    destructive: true
    idempotent: true
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: true
      open_world_hint: false
    next-tools:
      on-failure: [blender-rigging__inspect_armature]
    call_examples:
      - arguments:
          armature_name: CharacterRig
          transforms:
            - {bone_name: arm.L, rotation_euler: [0, 0.2, 0], rotation_mode: XYZ}
            - {bone_name: eye.R, rotation_quaternion: [1, 0, 0, 0]}
        note: Update local channels without changing frames or inserting keys.

  - name: create_armature
    description: "Create a Blender armature object."
    source_file: scripts/create_armature.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Armature object name.
        location:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
          description: Optional world location.
    output_schema: &rig_result_schema
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false

  - name: create_bone
    description: "Create an edit bone in an armature with optional parent bone."
    source_file: scripts/create_bone.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [armature_name, bone_name, head, tail]
      properties:
        armature_name:
          type: string
          minLength: 1
          description: Armature object name.
        bone_name:
          type: string
          minLength: 1
          description: New bone name.
        head:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
          description: Bone head coordinates.
        tail:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
          description: Bone tail coordinates.
        parent:
          type: string
          minLength: 1
          description: Optional parent bone name.
    output_schema: *rig_result_schema
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false

  - name: mirror_bones
    description: "Mirror armature edit bones across an axis using common left/right naming conventions."
    source_file: scripts/mirror_bones.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [armature_name]
      properties:
        armature_name:
          type: string
          minLength: 1
          description: Armature object name.
        axis:
          type: string
          enum: [x, y, z]
          default: x
          description: Mirror axis.
        naming_rule:
          type: string
          enum: [suffix, prefix, auto]
          default: suffix
          description: Naming convention hint.
    output_schema: *rig_result_schema
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false

  - name: add_constraint
    description: "Add a Blender object constraint and optionally assign a target object."
    source_file: scripts/add_constraint.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name, constraint_type]
      properties:
        object_name:
          type: string
          minLength: 1
          description: Object receiving the constraint.
        constraint_type:
          type: string
          minLength: 1
          description: Blender constraint type, such as COPY_LOCATION or TRACK_TO.
        target:
          type: string
          minLength: 1
          description: Optional target object name.
    output_schema: *rig_result_schema
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false

  - name: set_constraint_properties
    description: "Set supported RNA properties on an existing object constraint."
    source_file: scripts/set_constraint_properties.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name, constraint_name, properties]
      properties:
        object_name:
          type: string
          minLength: 1
          description: Constrained object name.
        constraint_name:
          type: string
          minLength: 1
          description: Constraint name.
        properties:
          type: object
          additionalProperties: true
          description: Properties to apply to the constraint.
    output_schema: *rig_result_schema
    read_only: false
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: bind_mesh_to_armature
    description: "Bind a mesh to an armature with an Armature modifier or Blender automatic weights."
    source_file: scripts/bind_mesh_to_armature.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [mesh_name, armature_name]
      properties:
        mesh_name:
          type: string
          minLength: 1
          description: Mesh object name.
        armature_name:
          type: string
          minLength: 1
          description: Armature object name.
        method:
          type: string
          enum: [modifier, automatic_weights]
          default: modifier
          description: Binding method.
    output_schema: *rig_result_schema
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false

  - name: add_shape_key
    description: "Add a shape key to a mesh object."
    source_file: scripts/add_shape_key.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name, name]
      properties:
        object_name:
          type: string
          minLength: 1
          description: Mesh object name.
        name:
          type: string
          minLength: 1
          description: Shape key name.
        from_mix:
          type: boolean
          default: false
          description: Create from current mix.
    output_schema: *rig_result_schema
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false

  - name: set_driver
    description: "Create or update a driver on an object data path."
    source_file: scripts/set_driver.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [object_name, data_path, expression]
      properties:
        object_name:
          type: string
          minLength: 1
          description: Object receiving the driver.
        data_path:
          type: string
          minLength: 1
          description: RNA data path to drive, such as location.x or scale.
        expression:
          type: string
          minLength: 1
          description: Driver expression.
        variables:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Optional driver variable specs.
    output_schema: *rig_result_schema
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false

  - name: retarget_animation
    description: "Copy current pose values and action data from one armature to another by bone mapping."
    source_file: scripts/retarget_animation.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [source_armature, target_armature]
      properties:
        source_armature:
          type: string
          minLength: 1
          description: Source armature object name.
        target_armature:
          type: string
          minLength: 1
          description: Target armature object name.
        mapping:
          type: object
          additionalProperties:
            type: string
          description: Optional source-bone to target-bone mapping.
    output_schema: *rig_result_schema
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
